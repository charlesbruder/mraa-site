# MRAA static site — no build step, publish repo root
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# Deploy Previews are enabled by default for pull requests.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
